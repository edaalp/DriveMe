spring:
  profiles:
    # Default to "dev,local" so application-local.yaml (gitignored, contains
    # SMTP credentials & MAIL_ENABLED=true) is picked up automatically during
    # local development. CI / prod must override via SPRING_PROFILES_ACTIVE.
    active: ${SPRING_PROFILES_ACTIVE:dev,local}
  application:
    name: driveme-backend
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB

  datasource:
    # `prepareThreshold=0` disables server-side prepared statements. Required
    # when pointing at Neon's pgbouncer-style pooler — otherwise Hibernate's
    # SchemaMigrator can hit "cached plan must not change result type" after
    # a Flyway migration that alters tables it introspected earlier in the
    # same pooled connection.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/driveme}
    username: ${SPRING_DATASOURCE_USERNAME:driveme}
    password: ${SPRING_DATASOURCE_PASSWORD:driveme123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Flyway is the source of truth for schema. Default `validate` once all
      # migrations match Neon. TEMPORARY `update`: bridge until V20260502_01
      # (vehicle_documents) is applied so Hibernate does not fail if Flyway
      # version order was behind DB history. Revert to `validate` after Neon
      # shows vehicle_documents and ddl aligns.
      ddl-auto: update
      show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    url: ${SPRING_FLYWAY_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/driveme}}
    user: ${SPRING_FLYWAY_USER:${SPRING_DATASOURCE_USERNAME:driveme}}
    password: ${SPRING_FLYWAY_PASSWORD:${SPRING_DATASOURCE_PASSWORD:driveme123}}
    validate-on-migrate: false
    repair-on-migrate: true

  # ── SMTP (email) ─────────────────────────────────────────────────────────
  # Set MAIL_ENABLED=true and supply credentials to send real emails.
  # For Gmail: create an App Password at https://myaccount.google.com/apppasswords
  #            (requires 2-Step Verification to be ON on the sender account).
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

server:
  # For emulator-only development we bind to localhost by default so the
  # backend is not reachable from other devices on the LAN. The Android
  # emulator reaches the host via 10.0.2.2 which maps to the host loopback.
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}

admin:
  signup-secret: ${ADMIN_SIGNUP_SECRET:dev-admin-signup-secret-change-me}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000}
  websocket:
    allowed-origin-patterns: ${APP_WEBSOCKET_ALLOWED_ORIGIN_PATTERNS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000}
  security:
    public-docs: ${APP_SECURITY_PUBLIC_DOCS:true}
    demo-public-payments: ${APP_SECURITY_DEMO_PUBLIC_PAYMENTS:true}
  upload:
    # Writable folder for signup uploads; served at /uploads/** (see WebMvcUploadConfig).
    dir: ${APP_UPLOAD_DIR:src/main/resources/static/uploads}
  # Public origin for absolute document URLs in JSON (no trailing slash).
  # Default targets the Android emulator loopback so colleagues using the emulator
  # can hit the backend without extra configuration. Override via
  # APP_PUBLIC_BASE_URL when running against a phone (e.g. http://192.168.1.5:8080).
  public-base-url: ${APP_PUBLIC_BASE_URL:http://10.0.2.2:8080}
  mail:
    # Set to true to send real OTP emails via SMTP.
    # When false the OTP is only logged and returned in the API response (dev mode).
    enabled: ${MAIL_ENABLED:false}
    # "From" address shown to recipients.
    from: ${MAIL_FROM:noreply@driveme.com}

logging:
  level:
    root: INFO
    com.driveme.backend: INFO

management:
  health:
    mail:
      enabled: false


# ============================================================
# PRICING CONFIGURATION
# Ankara Taxi Official Tariff - Effective 1 March 2026
# Source: Ankara Municipality
# ============================================================
pricing:
  # === ANKARA TAXI TARIFF (MARCH 2026) ===
  taxiMinFare: 200.0             # Bindi-İndi ücreti (TL)
  taxiOpeningFee: 65.0           # Açılış ücreti (TL)
  taxiPerKmRate: 40.0            # Kilometre ücreti (TL/km)
  taxiHourlyRate: 420.0          # Saat ücreti (TL/hour)
  taxiPerMinuteRate: 7.0         # Birim zaman ücreti (TL/min)
  taxiPer100mRate: 4.0           # Birim mesafe ücreti (TL/100m)

  # === DRIVER COMPENSATION ===
  # Factor for compensating driver's return trip
  # 1.0 = full return trip, 0.7 = 70% of forward trip
  driverReturnFactor: ${PRICING_DRIVER_RETURN_FACTOR:0.7}

  # === SERVICE FEE ===
  servicePercentage: ${PRICING_SERVICE_PERCENTAGE:0.15}  # 15%

  # === PRICE RANGE ===
  minPricePercentage: 0.9
  maxPricePercentage: 1.1
  currency: TRY

  # === TIME MULTIPLIERS ===
  rushHourStartMorning: 7
  rushHourEndMorning: 10
  rushHourStartEvening: 17
  rushHourEndEvening: 20
  rushHourMultiplier: ${PRICING_RUSH_HOUR_MULTIPLIER:1.25}
  nightTimeStart: 22
  nightTimeEnd: 6
  nightTimeMultiplier: ${PRICING_NIGHT_TIME_MULTIPLIER:1.15}
  weekendMultiplier: ${PRICING_WEEKEND_MULTIPLIER:1.1}

  # === SURGE/DEMAND MULTIPLIERS ===
  maxSurgeMultiplier: 3.0
  minSurgeMultiplier: 1.0
  surgeStepThreshold: 0.2        # 20% excess demand triggers surge step
  surgeStepIncrement: 0.25       # Each step adds 0.25 to multiplier

  # === WEATHER MULTIPLIERS ===
  lightRainMultiplier: 1.1
  heavyRainMultiplier: 1.25
  snowMultiplier: 1.35
  extremeHeatMultiplier: 1.1     # > 35°C
  extremeColdMultiplier: 1.15    # < 0°C

  # === TRAFFIC MULTIPLIERS ===
  moderateTrafficMultiplier: 1.1
  heavyTrafficMultiplier: 1.25
  severeTrafficMultiplier: 1.4

  # === SPECIAL LOCATIONS ===
  popularDestinationReturnFactor: 0.3

  # === GOOGLE MAPS API ===
  useGoogleMaps: ${USE_GOOGLE_MAPS:false}
  googleMapsApiKey: ${GOOGLE_MAPS_API_KEY:}
  useTrafficData: ${USE_TRAFFIC_DATA:false}

  # === WEATHER API (OpenWeatherMap) ===
  useWeatherApi: ${USE_WEATHER_API:false}
  weatherApiKey: ${WEATHER_API_KEY:}
  weatherApiUrl: https://api.openweathermap.org/data/2.5/weather
