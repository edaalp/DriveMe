spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: driveme-backend
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB
  
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5433/driveme}
    username: ${SPRING_DATASOURCE_USERNAME:driveme}
    password: ${SPRING_DATASOURCE_PASSWORD:driveme123}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    url: ${SPRING_FLYWAY_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5433/driveme}}
    user: ${SPRING_FLYWAY_USER:${SPRING_DATASOURCE_USERNAME:driveme}}
    password: ${SPRING_FLYWAY_PASSWORD:${SPRING_DATASOURCE_PASSWORD:driveme123}}

admin:
  signup-secret: ${ADMIN_SIGNUP_SECRET:driveme-admin-secret-2026}

app:
  upload:
    dir: ${APP_UPLOAD_DIR:uploads}
  # Public origin for absolute document URLs in API responses (no trailing slash).
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:8080}

logging:
  level:
    root: INFO
    com.driveme.backend: INFO

# Pricing configuration
pricing:
  # Ankara Taxi Tariff 2026 (midpoint values — override via env vars for exact tariff)
  taxiOpeningFee: 55.0           # TRY  (official range: 45–65)
  taxiPerKmRate: 36.0            # TRY/km  (official range: 32–40)
  taxiPerMinuteRate: 7.0         # TRY/min waiting
  taxiMinFare: 175.0             # TRY  indi-bindi minimum (official range: 150–200)

  servicePercentage: 0.15        # 15% of total taxi cost (both legs)

  minPricePercentage: 0.9
  maxPricePercentage: 1.1
  currency: TRY
  maxSurgeMultiplier: 3.0
  useGoogleMaps: false
  googleMapsApiKey: ${GOOGLE_MAPS_API_KEY:}

  rushHourStartMorning: 7
  rushHourEndMorning: 10
  rushHourStartEvening: 17
  rushHourEndEvening: 20
  rushHourMultiplier: 1.2
  nightTimeStart: 22
  nightTimeEnd: 6
  nightTimeMultiplier: 1.1
