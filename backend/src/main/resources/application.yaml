spring:
  profiles:
    # Default to "dev,local" so application-local.yaml (gitignored, contains
    # SMTP credentials & MAIL_ENABLED=true) is picked up automatically during
    # local development. CI / prod must override via SPRING_PROFILES_ACTIVE.
    active: ${SPRING_PROFILES_ACTIVE:dev,local}
  application:
    name: driveme-backend
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB

  datasource:
    # `prepareThreshold=0` disables server-side prepared statements. Required
    # when pointing at Neon's pgbouncer-style pooler — otherwise Hibernate's
    # SchemaMigrator can hit "cached plan must not change result type" after
    # a Flyway migration that alters tables it introspected earlier in the
    # same pooled connection.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://ep-aged-star-aldavdxb-pooler.c-3.eu-central-1.aws.neon.tech/neondb?sslmode=require&prepareThreshold=0}
    username: ${SPRING_DATASOURCE_USERNAME:neondb_owner}
    password: ${SPRING_DATASOURCE_PASSWORD:npg_DCGja3Q8Etuy}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Flyway is the source of truth for schema. `validate` just checks that
      # all mapped columns/tables exist at boot; `update` would double-manage
      # the schema and reliably triggers Postgres "cached plan" errors when
      # combined with a pooled connection.
      ddl-auto: validate
      show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    url: ${SPRING_FLYWAY_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://ep-aged-star-aldavdxb-pooler.c-3.eu-central-1.aws.neon.tech/neondb?sslmode=require}}
    user: ${SPRING_FLYWAY_USER:${SPRING_DATASOURCE_USERNAME:neondb_owner}}
    password: ${SPRING_FLYWAY_PASSWORD:${SPRING_DATASOURCE_PASSWORD:npg_DCGja3Q8Etuy}}
    validate-on-migrate: false
    repair-on-migrate: true

  # ── SMTP (email) ─────────────────────────────────────────────────────────
  # Set MAIL_ENABLED=true and supply credentials to send real emails.
  # For Gmail: create an App Password at https://myaccount.google.com/apppasswords
  #            (requires 2-Step Verification to be ON on the sender account).
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

admin:
  signup-secret: ${ADMIN_SIGNUP_SECRET:driveme-admin-secret-2026}

app:
  upload:
    # Writable folder for signup uploads; served at /uploads/** (see WebMvcUploadConfig).
    dir: ${APP_UPLOAD_DIR:src/main/resources/static/uploads}
  # Public origin for absolute document URLs in JSON (no trailing slash). Default targets Android emulator loopback; admin/browser on same machine: APP_PUBLIC_BASE_URL=http://localhost:8080
  public-base-url: ${APP_PUBLIC_BASE_URL:http://10.0.2.2:8080}
  mail:
    # Set to true to send real OTP emails via SMTP.
    # When false the OTP is only logged and returned in the API response (dev mode).
    enabled: ${MAIL_ENABLED:true}
    # "From" address shown to recipients.
    from: ${MAIL_FROM:noreply@driveme.com}

logging:
  level:
    root: INFO
    com.driveme.backend: INFO

management:
  health:
    mail:
      enabled: false


# Pricing configuration
pricing:
  # Ankara Taxi Tariff 2026 (midpoint values — override via env vars for exact tariff)
  taxiOpeningFee: 55.0           # TRY  (official range: 45–65)
  taxiPerKmRate: 36.0            # TRY/km  (official range: 32–40)
  taxiPerMinuteRate: 7.0         # TRY/min waiting
  taxiMinFare: 175.0             # TRY  indi-bindi minimum (official range: 150–200)

  servicePercentage: 0.15        # 15% of total taxi cost (both legs)

  minPricePercentage: 0.9
  maxPricePercentage: 1.1
  currency: TRY
  maxSurgeMultiplier: 3.0
  useGoogleMaps: false
  googleMapsApiKey: ${GOOGLE_MAPS_API_KEY:}

  rushHourStartMorning: 7
  rushHourEndMorning: 10
  rushHourStartEvening: 17
  rushHourEndEvening: 20
  rushHourMultiplier: 1.2
  nightTimeStart: 22
  nightTimeEnd: 6
  nightTimeMultiplier: 1.1
