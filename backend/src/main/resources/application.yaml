spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: driveme-backend
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB
  
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5433/driveme}
    username: ${SPRING_DATASOURCE_USERNAME:driveme}
    password: ${SPRING_DATASOURCE_PASSWORD:driveme123}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    url: ${SPRING_FLYWAY_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5433/driveme}}
    user: ${SPRING_FLYWAY_USER:${SPRING_DATASOURCE_USERNAME:driveme}}
    password: ${SPRING_FLYWAY_PASSWORD:${SPRING_DATASOURCE_PASSWORD:driveme123}}

admin:
  signup-secret: ${ADMIN_SIGNUP_SECRET:driveme-admin-secret-2026}

app:
  upload:
    dir: ${APP_UPLOAD_DIR:uploads}
  # Public origin for absolute document URLs in API responses (no trailing slash).
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:8080}

logging:
  level:
    root: INFO
    com.driveme.backend: INFO

# Pricing configuration
pricing:
  # Base fare in TRY (Turkish Lira)
  baseFare: ${PRICING_BASE_FARE:20.0}

  # Rate per kilometer in TRY
  perKmRate: ${PRICING_PER_KM_RATE:8.0}

  # Rate per minute in TRY
  perMinuteRate: ${PRICING_PER_MINUTE_RATE:1.0}

  # Maximum surge multiplier cap
  maxSurgeMultiplier: ${PRICING_MAX_SURGE:3.0}

  # Default currency
  currency: ${PRICING_CURRENCY:TRY}

  # Price range percentages (minPrice = base * 0.9, maxPrice = base * 1.1)
  minPricePercentage: ${PRICING_MIN_PERCENTAGE:0.9}
  maxPricePercentage: ${PRICING_MAX_PERCENTAGE:1.1}

  # Google Maps configuration
  useGoogleMaps: ${PRICING_USE_GOOGLE_MAPS:false}
  googleMapsApiKey: ${GOOGLE_MAPS_API_KEY:}

  # Rush hour configuration (UTC+3 for Istanbul)
  rushHourStartMorning: ${PRICING_RUSH_HOUR_START_MORNING:7}
  rushHourEndMorning: ${PRICING_RUSH_HOUR_END_MORNING:10}
  rushHourStartEvening: ${PRICING_RUSH_HOUR_START_EVENING:17}
  rushHourEndEvening: ${PRICING_RUSH_HOUR_END_EVENING:20}
  rushHourMultiplier: ${PRICING_RUSH_HOUR_MULTIPLIER:1.2}

  # Night time configuration
  nightTimeStart: ${PRICING_NIGHT_TIME_START:22}
  nightTimeEnd: ${PRICING_NIGHT_TIME_END:6}
  nightTimeMultiplier: ${PRICING_NIGHT_TIME_MULTIPLIER:1.1}

